<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MVS Foundation — Test</title>
<style>
  :root{
    --navy:#14243f; --navy2:#1f3357; --gold:#b8941f; --gold2:#d9b64e;
    --ink:#23252c; --muted:#6b7280; --line:#e8e0cf; --card:#fffdf7; --bg:#f3f1ea;
    --ok:#2e9e6b; --bad:#d1443a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:0 16px 70px}
  .narrow{max-width:640px;margin:0 auto}
  .hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:0 0 22px 22px;padding:22px 20px 26px;box-shadow:0 10px 30px -12px rgba(20,36,63,.5)}
  .hero-in{max-width:1140px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo{width:54px;height:54px;border-radius:50%;flex:0 0 auto;overflow:hidden;box-shadow:0 3px 12px -3px rgba(0,0,0,.45)}
  .brand .logo svg,.brand .logo img{width:100%;height:100%;display:block}
  .brand .logo img{object-fit:cover}
  .brand .bt{font-weight:800;letter-spacing:.5px;font-size:1.18rem}
  .brand .bs{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:1px}
  .hero h1{margin:16px 0 6px;font-size:1.5rem;line-height:1.25}
  .hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 4px 18px -12px rgba(40,30,10,.25)}
  .lead{color:var(--muted);font-size:.92rem;margin:2px 0 16px}
  label.fl{display:block;font-weight:700;font-size:.85rem;margin:14px 0 6px;color:#3a3d45}
  label.fl .req{color:var(--bad)}
  .inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:1rem;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  .inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,148,31,.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--gold),#a37d1c);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 8px 20px -10px rgba(184,148,31,.7);transition:transform .1s,box-shadow .15s}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.6;cursor:wait}
  .btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
  .err{display:none;background:rgba(209,68,58,.08);border:1px solid rgba(209,68,58,.3);color:#b91c1c;border-radius:10px;padding:10px 13px;font-size:.88rem;font-weight:600;margin-top:12px}

  /* ---- medium picker ---- */
  .mp-t{font-weight:800;font-size:1.15rem;text-align:center}
  .mp-s{color:var(--muted);font-size:.88rem;text-align:center;margin:4px 0 2px}
  .mp-grid{display:flex;flex-direction:column;gap:11px;margin-top:18px}
  .mp-opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;transition:border-color .12s,background .12s,transform .08s;width:100%;font-family:inherit}
  .mp-opt:hover{border-color:var(--gold);background:rgba(184,148,31,.05)}
  .mp-opt:active{transform:translateY(1px)}
  .mp-ic{width:42px;height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(135deg,var(--gold),#a37d1c);color:#fff;font-weight:900;font-size:1.05rem}
  .mp-tx b{display:block;font-size:1.02rem}
  .mp-tx small{color:var(--muted);font-size:.8rem}

  /* ---- sticky test bar ---- */
  .tbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:11px 14px;margin-top:16px;box-shadow:0 8px 22px -12px rgba(20,36,63,.6)}
  .tbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tbar .tt{font-weight:800;font-size:.98rem;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msel{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:9px;padding:7px 10px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit}
  .msel option{color:#14243f}
  .timer{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;border:none;border-radius:10px;padding:8px 13px;font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px -4px rgba(184,148,31,.75);letter-spacing:.02em}
  .timer .clk{font-size:.95em;line-height:1}
  .timer.warn{background:linear-gradient(135deg,#ff7a6b,#e0453a);color:#fff;box-shadow:0 4px 16px -3px rgba(209,68,58,.8);animation:blink 1s steps(2,start) infinite}
  .timer.over{background:#d1443a;color:#fff;animation:blink .7s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.32}}
  .attc{font-size:.78rem;font-weight:700;color:rgba(255,255,255,.85);margin-top:9px}
  .attc b{color:var(--gold2)}
  .attbar{height:6px;border-radius:999px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
  .attbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:999px;transition:width .25s}

  /* ---- NTA-style exam layout: questions left, sticky palette right ---- */
  .exam{display:flex;gap:18px;align-items:flex-start;margin-top:14px}
  .exam-main{flex:1 1 auto;min-width:0}
  .exam-side{flex:0 0 302px;width:302px;position:sticky;top:104px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 26px -16px rgba(40,30,10,.4);overflow:hidden}
  .side-h{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;font-weight:800;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;padding:13px 15px}
  .side-close{display:none;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:9px;font-size:1rem;cursor:pointer;font-family:inherit}
  .legend{display:flex;flex-wrap:wrap;gap:9px 14px;padding:12px 15px;border-bottom:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .lg-dot{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line);background:#fff;display:inline-block;flex:0 0 auto}
  .lg-dot.done{background:linear-gradient(135deg,var(--ok),#1f7a44);border-color:transparent}
  .lg-dot.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,148,31,.3)}
  .side-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 15px;max-height:44vh;overflow-y:auto}
  .side-foot{padding:13px 15px;border-top:1px solid var(--line)}
  .side-att{font-size:.82rem;font-weight:700;color:var(--muted);text-align:center;margin-bottom:11px}
  .side-att b{color:var(--navy);font-size:1.05rem}
  .pn{height:42px;width:100%;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:800;font-size:.9rem;cursor:pointer;transition:all .12s;font-family:inherit;font-variant-numeric:tabular-nums}
  .pn:hover{border-color:var(--gold)}
  .pn:focus{outline:none}
  .pn:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .pn.done{background:linear-gradient(135deg,var(--ok),#1f7a44);color:#fff;border-color:transparent;box-shadow:0 4px 10px -5px rgba(46,158,107,.7)}
  .pn.cur{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,148,31,.28)}
  .pn.done.cur{box-shadow:0 0 0 3px rgba(184,148,31,.5)}
  .sheet-ov{display:none;position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-ov.open{opacity:1;pointer-events:auto}
  /* ---- mobile bottom action bar ---- */
  .mbar{display:none}
  .mbar-prog{display:inline-flex;align-items:center;gap:5px;color:#fff;font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums}
  .mbar-prog b{color:var(--gold2);font-size:1.05rem}
  .mbar-pal{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);color:#fff;border-radius:11px;padding:11px 12px;font-weight:800;font-size:.86rem;cursor:pointer;font-family:inherit}
  .mbar-sub{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;border:none;border-radius:11px;padding:11px 18px;font-weight:900;font-size:.9rem;cursor:pointer;font-family:inherit;box-shadow:0 5px 16px -6px rgba(184,148,31,.8)}
  .mbar-sub[disabled]{opacity:.65;cursor:wait}

  /* ---- questions ---- */
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-top:14px;scroll-margin-top:104px}
  .q-h{font-weight:800;font-size:1.02rem;margin-bottom:4px}
  .q-hi{color:#4a4d55;font-weight:600;font-size:.96rem;margin:3px 0 2px}
  .q-img{max-width:100%;border-radius:10px;margin:8px 0}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:11px}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s;font-size:.96rem}
  .opt:hover{border-color:var(--gold)}
  .opt .k{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(120,110,80,.12);font-weight:800;font-size:.8rem}
  .opt.sel{border-color:var(--gold);background:rgba(184,148,31,.09)}
  .opt.sel .k{background:var(--gold);color:#fff}
  .opt .ohi{color:#5a5d65;font-weight:600}
  .opt input{display:none}

  /* ---- result ---- */
  .score{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:20px 22px;margin-top:18px}
  .score .big{font-size:2.2rem;font-weight:900;line-height:1}
  .score .sub{font-size:.82rem;color:rgba(255,255,255,.7);margin-top:3px}
  .score .ring{text-align:center}
  .score .pct{font-size:1.5rem;font-weight:900;color:var(--gold2)}
  .rv .opt.ok{border-color:var(--ok);background:rgba(46,158,107,.12)} .rv .opt.ok .k{background:var(--ok);color:#fff}
  .rv .opt.bad{border-color:var(--bad);background:rgba(209,68,58,.1)} .rv .opt.bad .k{background:var(--bad);color:#fff}
  .rv .opt.cor{border-color:var(--ok);border-style:dashed} .rv .opt.cor .k{background:var(--ok);color:#fff}
  .badge{margin-left:auto;font-size:.64rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .badge.g{background:rgba(46,158,107,.16);color:#1f7a44}.badge.r{background:rgba(209,68,58,.14);color:#b91c1c}
  .expl{margin-top:9px;background:rgba(184,148,31,.07);border-left:3px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:.88rem;color:#4a4330}
  .center{text-align:center;padding:60px 20px;color:var(--muted)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .note{font-size:.8rem;color:var(--muted);margin-top:10px;text-align:center}
  /* ---- responsive: palette becomes a bottom-sheet + sticky action bar ---- */
  @media(max-width:920px){
    .wrap{padding-bottom:88px}
    .exam{display:block}
    .exam-side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;flex:none;border:none;border-radius:20px 20px 0 0;transform:translateY(112%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:60;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 -12px 34px -10px rgba(0,0,0,.45)}
    .exam-side.open{transform:translateY(0)}
    .side-close{display:inline-flex;align-items:center;justify-content:center}
    .side-grid{grid-template-columns:repeat(6,1fr);max-height:52vh}
    .side-foot{display:none}
    .sheet-ov{display:block}
    .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;align-items:center;gap:10px;background:linear-gradient(135deg,var(--navy),var(--navy2));padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -8px rgba(0,0,0,.45)}
  }
  @media(max-width:480px){ .hero h1{font-size:1.25rem} .score .big{font-size:1.8rem} .side-grid{grid-template-columns:repeat(5,1fr)} .tbar .tt{min-width:90px;font-size:.9rem} }
</style>
</head>
<body>
  <div class="hero"><div class="hero-in">
    <div class="brand">
      <div class="logo" id="lg-wrap">
        <svg class="lg-svg" viewBox="0 0 100 100" role="img" aria-label="MVS Foundation">
          <defs><linearGradient id="lgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eccf78"/><stop offset="1" stop-color="#b8941f"/></linearGradient></defs>
          <circle cx="50" cy="50" r="48" fill="#14243f" stroke="url(#lgG)" stroke-width="3.5"/>
          <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#lgG)" stroke-width="1" opacity=".5"/>
          <path d="M50 26 L72 34 L50 42 L28 34 Z" fill="url(#lgG)"/>
          <path d="M37 38.5 V46.5 Q50 53.5 63 46.5 V38.5" fill="none" stroke="url(#lgG)" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M72 34 V45.5" stroke="url(#lgG)" stroke-width="1.5"/>
          <circle cx="72" cy="47" r="1.9" fill="url(#lgG)"/>
          <text x="50" y="75" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" fill="url(#lgG)" letter-spacing="1">MVS</text>
        </svg>
        <img id="lg-img" alt="MVS Foundation" style="display:none">
      </div>
      <div><div class="bt">MVS Foundation</div><div class="bs">Manish Verma Classes</div></div>
    </div>
    <h1 id="h-title">Loading test…</h1>
    <div class="meta" id="h-meta"></div>
  </div></div>
  <div class="wrap" id="app">
    <div class="center"><div class="spin"></div>Please wait…</div>
  </div>

<script>
(function(){
  "use strict";
  var token=(location.pathname.split("/t/")[1]||"").split(/[?#/]/)[0];
  var APP=document.getElementById("app");
  var H1=document.getElementById("h-title"), HM=document.getElementById("h-meta");
  var EX=null, ANS={}, MED="en", HASHI=false, STARTMS=0, TIMER=null, SUBMITTED=false;

  // premium: asli MVS logo (public /api/student/logo); na mile to gold 'MVS' box
  (function(){ var im=document.getElementById("lg-img"), sv=document.querySelector("#lg-wrap .lg-svg");
    im.onload=function(){ if(sv)sv.style.display="none"; im.style.display="block"; };
    im.onerror=function(){ im.remove(); };   // server logo na ho to premium SVG emblem dikhta rahega
    im.src="/api/student/logo"; })();

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function api(path,method,body){
    return fetch("/api/public"+path,{method:method||"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):null})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error((j&&j.detail)||("Error "+r.status)); return j; }); });
  }
  function val(id){ var el=document.getElementById(id); return el?el.value:""; }
  function meta(){ var m=[]; if(EX.subject)m.push(EX.subject); if(EX.question_count)m.push(EX.question_count+" questions"); if(EX.total_marks)m.push(EX.total_marks+" marks"); if(EX.duration_min)m.push(EX.duration_min+" min"); if(EX.teacher_name)m.push("By "+EX.teacher_name);
    HM.innerHTML=m.map(function(x){return '<span class="pill">'+esc(x)+'</span>';}).join(""); }

  // kya test me Hindi content hai? (teacher ne bilingual banaya ho to hi medium choice dikhao)
  function hasHindi(){
    return (EX.questions||[]).some(function(q){
      if((q.question_text_hi||"").trim()) return true;
      return Array.isArray(q.options_hi) && q.options_hi.some(function(o){return (o||"").trim();});
    });
  }
  // question text selected medium me
  function qText(q){
    var en=(q.question_text||""), hi=(q.question_text_hi||"").trim();
    if(MED==="hi") return esc(hi||en);
    if(MED==="hg" && hi && hi!==en.trim()) return esc(en)+'<div class="q-hi">'+esc(hi)+'</div>';
    return esc(en);
  }
  // option display selected medium me (grading value HAMESHA English hi rehti hai)
  function optText(q,i){
    var en=(q.options&&q.options[i]!=null)?String(q.options[i]):"";
    var hi=(Array.isArray(q.options_hi)&&(q.options_hi[i]||"").trim())?String(q.options_hi[i]):"";
    if(MED==="hi") return esc(hi||en);
    if(MED==="hg" && hi && hi!==en.trim()) return esc(en)+' <span class="ohi">· '+esc(hi)+'</span>';
    return esc(en);
  }

  // ---------- 1) REGISTER ----------
  function screenRegister(){
    meta();
    var extra=(EX.fields||[]).map(function(f){
      var req=(f.required!==false);
      var star=req?' <span class="req">*</span>':' <span style="color:#9a9284;font-weight:600;font-size:.82em">(optional)</span>';
      // dropdown (e.g. Class / Course) vs plain text — Google-Form style
      if(f.type==="select"){
        var opts='<option value="">Select…</option>'+(f.options||[]).map(function(o){return '<option value="'+esc(o)+'">'+esc(o)+'</option>';}).join("");
        return '<label class="fl">'+esc(f.label)+star+'</label><select class="inp" id="f-'+esc(f.key)+'">'+opts+'</select>';
      }
      return '<label class="fl">'+esc(f.label)+star+'</label><input class="inp" id="f-'+esc(f.key)+'" autocomplete="off">';
    }).join("");
    APP.innerHTML=
      '<div class="narrow"><div class="card">'
      +'<div style="font-weight:800;font-size:1.1rem">Enter your details to begin</div>'
      +'<div class="lead">Fill the form below, then start the test. You can attempt it only once.</div>'
      +'<label class="fl">Full Name <span class="req">*</span></label><input class="inp" id="f-name" autocomplete="name">'
      +'<label class="fl">Phone Number <span class="req">*</span></label><input class="inp" id="f-phone" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number">'
      +extra
      +'<div class="err" id="reg-err"></div>'
      +'<button class="btn" id="reg-go" style="margin-top:18px">Continue →</button>'
      +'<div class="note">Your details are shared only with MVS Foundation.</div>'
      +'</div></div>';
    document.getElementById("reg-go").onclick=function(){
      var name=(val("f-name")).trim(), phone=(val("f-phone")).replace(/[^0-9]/g,"");
      if(!name) return regErr("Please enter your name.");
      if(phone.length<10) return regErr("Please enter a valid 10-digit phone number.");
      for(var i=0;i<(EX.fields||[]).length;i++){ var f=EX.fields[i]; if(f.required!==false && !val("f-"+f.key).trim()) return regErr((f.type==="select"?"Please select: ":"Please fill: ")+f.label); }
      window._reg={name:name,phone:phone}; (EX.fields||[]).forEach(function(f){ window._reg[f.key]=val("f-"+f.key).trim(); });
      if(HASHI) screenMedium(); else { MED="en"; screenTest(); }
    };
  }
  function regErr(m){ var e=document.getElementById("reg-err"); if(e){ e.textContent=m; e.style.display="block"; } }

  // ---------- 1b) SELECT MEDIUM ----------
  function screenMedium(){
    window.scrollTo(0,0);
    APP.innerHTML=
      '<div class="narrow"><div class="card">'
      +'<div class="mp-t">Select Medium · माध्यम चुनें</div>'
      +'<div class="mp-s">Choose the language in which you want to attempt this test. You can change it anytime during the test.</div>'
      +'<div class="mp-grid">'
      +'<button class="mp-opt" data-m="en"><span class="mp-ic">A</span><span class="mp-tx"><b>English</b><small>Questions &amp; options in English</small></span></button>'
      +'<button class="mp-opt" data-m="hi"><span class="mp-ic">अ</span><span class="mp-tx"><b>हिंदी</b><small>प्रश्न और विकल्प हिंदी में</small></span></button>'
      +'<button class="mp-opt" data-m="hg"><span class="mp-ic" style="font-size:.86rem">Aअ</span><span class="mp-tx"><b>Hinglish</b><small>English + हिंदी — bilingual</small></span></button>'
      +'</div></div></div>';
    Array.prototype.forEach.call(APP.querySelectorAll(".mp-opt"),function(b){
      b.onclick=function(){ MED=b.getAttribute("data-m"); screenTest(); };
    });
  }

  // ---------- 2) TEST ----------
  function screenTest(){
    window.scrollTo(0,0);
    if(!STARTMS){ STARTMS=Date.now(); ANS={}; }   // timer + answers sirf pehli baar reset (medium switch pe nahi)
    renderTest();
    startTimer();
  }
  function renderTest(){
    var medSel=HASHI
      ? '<select class="msel" id="msel" title="Language / माध्यम">'
        +'<option value="en"'+(MED==="en"?" selected":"")+'>English</option>'
        +'<option value="hi"'+(MED==="hi"?" selected":"")+'>हिंदी</option>'
        +'<option value="hg"'+(MED==="hg"?" selected":"")+'>Hinglish</option></select>'
      : '';
    var timer=EX.duration_min?'<span class="timer" id="timer"><span class="clk">⏱</span> --:--:--</span>':'';
    var N=(EX.questions||[]).length;
    var palNums=(EX.questions||[]).map(function(q){ var a=ANS[q.q_no]!=null; return '<button type="button" class="pn'+(a?" done":"")+'" id="pn-'+q.q_no+'" data-go="'+q.q_no+'">'+q.q_no+'</button>'; }).join("");
    var side='<aside class="exam-side" id="exam-side">'
      +'<div class="side-h"><span>Question Palette</span><button type="button" class="side-close" id="side-close" aria-label="Close">✕</button></div>'
      +'<div class="legend"><span><i class="lg-dot done"></i>Answered</span><span><i class="lg-dot cur"></i>Current</span><span><i class="lg-dot"></i>Not answered</span></div>'
      +'<div class="side-grid" id="side-grid">'+palNums+'</div>'
      +'<div class="side-foot"><div class="side-att"><b id="side-a">0</b> / '+N+' answered</div>'
      +'<button class="btn js-sub" id="sub-side">Submit Test</button></div>'
      +'</aside>';
    var qs=(EX.questions||[]).map(function(q){
      var opts=(q.options||[]).map(function(o,oi){
        var sel=(ANS[q.q_no]!=null && String(ANS[q.q_no])===String(o))?" sel":"";
        return '<label class="opt'+sel+'" data-q="'+q.q_no+'" data-v="'+esc(o)+'"><span class="k">'+String.fromCharCode(65+oi)+'</span><span>'+optText(q,oi)+'</span><input type="radio" name="q'+q.q_no+'"></label>';
      }).join("");
      var img=q.image_b64?'<img class="q-img" src="'+esc(q.image_b64)+'">':'';
      return '<div class="q" id="pq-'+q.q_no+'" data-qn="'+q.q_no+'"><div class="q-h">Q'+q.q_no+'. '+qText(q)+'</div>'+img+'<div class="opts">'+opts+'</div></div>';
    }).join("");
    APP.innerHTML=
      '<div class="tbar"><div class="tbar-row"><span class="tt">'+esc(window._reg.name)+'</span>'+medSel+timer+'</div>'
      +'<div class="attc"><span id="attc-t"><b>0</b> / '+N+' answered</span></div>'
      +'<div class="attbar"><i id="attbar-i"></i></div></div>'
      +'<div class="exam"><div class="exam-main">'+qs+'<div class="err" id="t-err"></div></div>'+side+'</div>'
      +'<div class="sheet-ov" id="sheet-ov"></div>'
      +'<div class="mbar" id="mbar"><span class="mbar-prog"><b id="mbar-a">0</b>/'+N+'</span>'
      +'<button type="button" class="mbar-pal" id="mbar-pal">▦ Questions</button>'
      +'<button class="mbar-sub js-sub" id="mbar-sub">Submit</button></div>';
    // option select
    Array.prototype.forEach.call(APP.querySelectorAll(".opt"),function(el){
      el.onclick=function(){ var q=el.getAttribute("data-q"); ANS[q]=el.getAttribute("data-v");
        Array.prototype.forEach.call(APP.querySelectorAll('.opt[data-q="'+q+'"]'),function(o){ o.classList.remove("sel"); });
        el.classList.add("sel");
        var pn=document.getElementById("pn-"+q); if(pn) pn.classList.add("done");
        updAtt(); };
    });
    // palette jump (mobile: sheet band ho jaaye jump ke baad)
    Array.prototype.forEach.call(APP.querySelectorAll(".pn"),function(b){
      b.onclick=function(){ var t=document.getElementById("pq-"+b.getAttribute("data-go")); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); sheet(false); };
    });
    var ms=document.getElementById("msel"); if(ms) ms.onchange=function(){ MED=ms.value; renderTest(); startTimer(); };
    Array.prototype.forEach.call(APP.querySelectorAll(".js-sub"),function(b){ b.onclick=function(){ doSubmit(false); }; });
    var mp=document.getElementById("mbar-pal"); if(mp) mp.onclick=function(){ sheet(true); };
    var sc=document.getElementById("side-close"); if(sc) sc.onclick=function(){ sheet(false); };
    var ov=document.getElementById("sheet-ov"); if(ov) ov.onclick=function(){ sheet(false); };
    setupObserver();
    updAtt();
  }
  // mobile palette bottom-sheet open/close
  function sheet(open){ var s=document.getElementById("exam-side"), ov=document.getElementById("sheet-ov"); if(s) s.classList.toggle("open",!!open); if(ov) ov.classList.toggle("open",!!open); }
  // current-question highlight in palette (NTA feel) — jo question screen par hai uska number gold
  var IO=null;
  function setupObserver(){
    if(IO){ IO.disconnect(); IO=null; }
    if(!("IntersectionObserver" in window)) return;
    var vis={};
    IO=new IntersectionObserver(function(ents){
      ents.forEach(function(e){ var qn=e.target.getAttribute("data-qn"); if(e.isIntersecting) vis[qn]=1; else delete vis[qn]; });
      var cur=null; Object.keys(vis).forEach(function(k){ var n=parseInt(k,10); if(cur==null||n<cur) cur=n; });
      Array.prototype.forEach.call(document.querySelectorAll(".pn.cur"),function(b){ b.classList.remove("cur"); });
      if(cur!=null){ var pn=document.getElementById("pn-"+cur); if(pn) pn.classList.add("cur"); }
    },{rootMargin:"-104px 0px -55% 0px",threshold:0.01});
    Array.prototype.forEach.call(document.querySelectorAll(".q"),function(q){ IO.observe(q); });
  }
  function updAtt(){
    var N=(EX.questions||[]).length, a=0;
    (EX.questions||[]).forEach(function(q){ if(ANS[q.q_no]!=null) a++; });
    var pct=(N?Math.round(a/N*100):0);
    var t=document.getElementById("attc-t"); if(t) t.innerHTML="<b>"+a+"</b> / "+N+" answered";
    var bar=document.getElementById("attbar-i"); if(bar) bar.style.width=pct+"%";
    var sa=document.getElementById("side-a"); if(sa) sa.textContent=a;
    var ma=document.getElementById("mbar-a"); if(ma) ma.textContent=a;
    var ss=document.getElementById("sub-side"); if(ss && !SUBMITTED) ss.textContent=(a>=N?"Submit Test":"Submit Test ("+a+"/"+N+")");
  }

  // ---------- timer ----------
  function startTimer(){
    if(TIMER){ clearInterval(TIMER); TIMER=null; }
    if(!EX.duration_min) return;
    var totalMs=EX.duration_min*60000;
    function tick(){
      var el=document.getElementById("timer"); if(!el){ clearInterval(TIMER); TIMER=null; return; }
      var left=totalMs-(Date.now()-STARTMS); var over=left<=0; if(over)left=0;
      var s=Math.floor(left/1000);
      var h=String(Math.floor(s/3600)).padStart(2,"0"), m=String(Math.floor((s%3600)/60)).padStart(2,"0"), ss=String(s%60).padStart(2,"0");
      var warn=(!over && left<=5*60000);   // 5 min se kam -> blink
      el.innerHTML='<span class="clk">⏱</span> '+h+":"+m+":"+ss; el.classList.toggle("over",over); el.classList.toggle("warn",warn);
      el.title=over?"Time over":(warn?"Less than 5 minutes left!":"Time remaining");
      if(over && !SUBMITTED){ clearInterval(TIMER); TIMER=null; doSubmit(true); }
    }
    tick(); TIMER=setInterval(tick,1000);
  }

  // ---------- submit ----------
  function subBtns(){ return Array.prototype.slice.call(document.querySelectorAll(".js-sub")); }
  function doSubmit(auto){
    if(SUBMITTED) return;
    var answered=Object.keys(ANS).length, total=(EX.questions||[]).length;
    if(!auto && answered<total){
      sheet(false);
      var e=document.getElementById("t-err");
      if(e){ e.textContent="Please answer all "+total+" questions ("+answered+" done). Tap a number in the palette to jump to a skipped question."; e.style.display="block"; e.scrollIntoView({behavior:"smooth",block:"center"}); }
      return;
    }
    SUBMITTED=true; sheet(false); if(TIMER){ clearInterval(TIMER); TIMER=null; }
    subBtns().forEach(function(b){ b.disabled=true; b.textContent="Submitting…"; });
    api("/exam/"+encodeURIComponent(token)+"/submit","POST",{details:window._reg,mcq_answers:ANS})
      .then(screenResult)
      .catch(function(err){ SUBMITTED=false;
        subBtns().forEach(function(b){ b.disabled=false; b.textContent=(b.id==="mbar-sub"?"Submit":"Submit Test"); });
        updAtt();
        var e=document.getElementById("t-err"); if(e){ e.textContent=err.message||"Could not submit. Try again."; e.style.display="block"; e.scrollIntoView({behavior:"smooth",block:"center"}); } });
  }

  // ---------- 3) RESULT ----------
  function screenResult(r){
    window.scrollTo(0,0); if(TIMER){ clearInterval(TIMER); TIMER=null; }
    var pct=r.total_marks?Math.round(r.total_awarded/r.total_marks*100):0;
    var rev=(r.results||[]).map(function(it){
      var yourN=(it.your_answer==null?"":String(it.your_answer).trim().toLowerCase());
      var corN=String(it.correct_answer==null?"":it.correct_answer).trim().toLowerCase();
      var opts=(it.options||[]).map(function(o,oi){
        var oN=String(o).trim().toLowerCase(), cls="opt", badge="";
        var isSel=(yourN!==""&&oN===yourN), isCor=(corN!==""&&oN===corN);
        if(isSel&&isCor){ cls+=" ok"; badge='<span class="badge g">Your answer · Correct</span>'; }
        else if(isSel&&!isCor){ cls+=" bad"; badge='<span class="badge r">Your answer</span>'; }
        else if(isCor){ cls+=" cor"; badge='<span class="badge g">Correct answer</span>'; }
        return '<div class="'+cls+'"><span class="k">'+String.fromCharCode(65+oi)+'</span><span>'+optText(it,oi)+'</span>'+badge+'</div>';
      }).join("");
      var skip=(yourN==="")?'<div class="note" style="text-align:left;color:#b91c1c;font-weight:700">⚠ You did not answer this</div>':"";
      var expl=(it.explanation&&String(it.explanation).trim())?'<div class="expl"><b>Explanation:</b> '+esc(it.explanation)+'</div>':"";
      return '<div class="q rv" id="pq-'+it.q_no+'"><div class="q-h">Q'+it.q_no+'. '+qText(it)+'</div><div class="opts">'+opts+'</div>'+skip+expl+'</div>';
    }).join("");
    APP.innerHTML=
      '<div class="narrow"><div class="score"><div><div class="big">'+r.total_awarded+' / '+r.total_marks+'</div><div class="sub">'+r.correct+' of '+r.q_total+' correct</div></div><div class="ring"><div class="pct">'+pct+'%</div></div></div>'
      +'<div class="card" style="margin-top:14px"><b>Thank you, '+esc(window._reg.name)+'!</b><div class="lead" style="margin:4px 0 0">Your test has been submitted to MVS Foundation. Review your answers below.</div></div>'
      +rev
      +'<div class="note" style="margin-top:20px">MVS Foundation · Manish Verma Classes</div></div>';
    H1.textContent="Your Result"; HM.innerHTML="";
  }

  // ---------- boot ----------
  function fail(msg){ H1.textContent="Test unavailable"; HM.innerHTML=""; APP.innerHTML='<div class="card center" style="padding:40px 20px"><div style="font-size:2rem">🔒</div><p style="font-weight:700;margin:10px 0 4px">'+esc(msg)+'</p><div class="lead">Please check the link with MVS Foundation.</div></div>'; }
  if(!token){ fail("Invalid test link."); return; }
  api("/exam/"+encodeURIComponent(token)).then(function(ex){
    EX=ex; HASHI=hasHindi(); H1.textContent=ex.title||"Test"; screenRegister();
  }).catch(function(err){ fail(err.message||"This test link is not available."); });
})();
</script>
</body>
