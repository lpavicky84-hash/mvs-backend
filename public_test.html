<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MVS Foundation — Test</title>
<style>
  :root{
    --navy:#14243f; --navy2:#1f3357; --gold:#b8941f; --gold2:#d9b64e;
    --ink:#23252c; --muted:#6b7280; --line:#e8e0cf; --card:#fffdf7; --bg:#f3f1ea;
    --ok:#2e9e6b; --bad:#d1443a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:0 16px 70px}
  .narrow{max-width:640px;margin:0 auto}
  .hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:0 0 22px 22px;padding:22px 20px 26px;box-shadow:0 10px 30px -12px rgba(20,36,63,.5)}
  .hero-in{max-width:1140px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo{width:54px;height:54px;border-radius:50%;flex:0 0 auto;overflow:hidden;box-shadow:0 3px 12px -3px rgba(0,0,0,.45)}
  .brand .logo svg,.brand .logo img{width:100%;height:100%;display:block}
  .brand .logo img{object-fit:cover}
  .brand .bt{font-weight:800;letter-spacing:.5px;font-size:1.18rem}
  .brand .bs{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:1px}
  .hero h1{margin:16px 0 6px;font-size:1.5rem;line-height:1.25}
  .hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 4px 18px -12px rgba(40,30,10,.25)}
  .lead{color:var(--muted);font-size:.92rem;margin:2px 0 16px}
  label.fl{display:block;font-weight:700;font-size:.85rem;margin:14px 0 6px;color:#3a3d45}
  label.fl .req{color:var(--bad)}
  .inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:1rem;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  .inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,148,31,.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--gold),#a37d1c);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 8px 20px -10px rgba(184,148,31,.7);transition:transform .1s,box-shadow .15s}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.6;cursor:wait}
  .btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
  .err{display:none;background:rgba(209,68,58,.08);border:1px solid rgba(209,68,58,.3);color:#b91c1c;border-radius:10px;padding:10px 13px;font-size:.88rem;font-weight:600;margin-top:12px}

  /* ---- medium picker ---- */
  .mp-t{font-weight:800;font-size:1.15rem;text-align:center}
  .mp-s{color:var(--muted);font-size:.88rem;text-align:center;margin:4px 0 2px}
  .mp-grid{display:flex;flex-direction:column;gap:11px;margin-top:18px}
  .mp-opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;transition:border-color .12s,background .12s,transform .08s;width:100%;font-family:inherit}
  .mp-opt:hover{border-color:var(--gold);background:rgba(184,148,31,.05)}
  .mp-opt:active{transform:translateY(1px)}
  .mp-ic{width:42px;height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(135deg,var(--gold),#a37d1c);color:#fff;font-weight:900;font-size:1.05rem}
  .mp-tx b{display:block;font-size:1.02rem}
  .mp-tx small{color:var(--muted);font-size:.8rem}

  /* ---- sticky test bar ---- */
  .tbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:11px 14px;margin-top:16px;box-shadow:0 8px 22px -12px rgba(20,36,63,.6)}
  .tbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tbar .tt{font-weight:800;font-size:.98rem;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msel{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:9px;padding:7px 10px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit}
  .msel option{color:#14243f}
  .timer{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;border:none;border-radius:10px;padding:8px 13px;font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px -4px rgba(184,148,31,.75);letter-spacing:.02em}
  .timer .clk{font-size:.95em;line-height:1}
  .timer.warn{background:linear-gradient(135deg,#ff7a6b,#e0453a);color:#fff;box-shadow:0 4px 16px -3px rgba(209,68,58,.8);animation:blink 1s steps(2,start) infinite}
  .timer.over{background:#d1443a;color:#fff;animation:blink .7s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.32}}
  .attc{font-size:.78rem;font-weight:700;color:rgba(255,255,255,.85);margin-top:9px}
  .attc b{color:var(--gold2)}
  .attbar{height:6px;border-radius:999px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
  .attbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:999px;transition:width .25s}

  /* ---- NTA-style exam layout: questions left, sticky palette right ---- */
  .exam{display:flex;gap:18px;align-items:flex-start;margin-top:14px}
  .exam-main{flex:1 1 auto;min-width:0}
  .exam-side{flex:0 0 302px;width:302px;position:sticky;top:104px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 26px -16px rgba(40,30,10,.4);overflow:hidden}
  .side-h{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;font-weight:800;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;padding:13px 15px}
  .side-close{display:none;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:9px;font-size:1rem;cursor:pointer;font-family:inherit}
  .legend{display:flex;flex-wrap:wrap;gap:9px 14px;padding:12px 15px;border-bottom:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .lg-dot{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line);background:#fff;display:inline-block;flex:0 0 auto}
  .lg-dot.done{background:linear-gradient(135deg,var(--ok),#1f7a44);border-color:transparent}
  .lg-dot.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,148,31,.3)}
  .side-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 15px;max-height:44vh;overflow-y:auto}
  .side-foot{padding:13px 15px;border-top:1px solid var(--line)}
  .side-att{font-size:.82rem;font-weight:700;color:var(--muted);text-align:center;margin-bottom:11px}
  .side-att b{color:var(--navy);font-size:1.05rem}
  .pn{height:42px;width:100%;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:800;font-size:.9rem;cursor:pointer;transition:all .12s;font-family:inherit;font-variant-numeric:tabular-nums}
  .pn:hover{border-color:var(--gold)}
  .pn:focus{outline:none}
  .pn:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .pn.done{background:linear-gradient(135deg,var(--ok),#1f7a44);color:#fff;border-color:transparent;box-shadow:0 4px 10px -5px rgba(46,158,107,.7)}
  .pn.cur{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,148,31,.28)}
  .pn.done.cur{box-shadow:0 0 0 3px rgba(184,148,31,.5)}
  .sheet-ov{display:none;position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-ov.open{opacity:1;pointer-events:auto}
  /* ---- mobile bottom action bar ---- */
  .mbar{display:none}
  .mbar-prog{display:inline-flex;align-items:center;gap:5px;color:#fff;font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums}
  .mbar-prog b{color:var(--gold2);font-size:1.05rem}
  .mbar-pal{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);color:#fff;border-radius:11px;padding:11px 12px;font-weight:800;font-size:.86rem;cursor:pointer;font-family:inherit}
  .mbar-sub{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;border:none;border-radius:11px;padding:11px 18px;font-weight:900;font-size:.9rem;cursor:pointer;font-family:inherit;box-shadow:0 5px 16px -6px rgba(184,148,31,.8)}
  .mbar-sub[disabled]{opacity:.65;cursor:wait}

  /* ---- questions ---- */
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-top:14px;scroll-margin-top:104px}
  .q-h{font-weight:800;font-size:1.02rem;margin-bottom:4px}
  .q-hi{color:#4a4d55;font-weight:600;font-size:.96rem;margin:3px 0 2px}
  .q-img{max-width:100%;border-radius:10px;margin:8px 0}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:11px}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s;font-size:.96rem}
  .opt:hover{border-color:var(--gold)}
  .opt .k{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(120,110,80,.12);font-weight:800;font-size:.8rem}
  .opt.sel{border-color:var(--gold);background:rgba(184,148,31,.09)}
  .opt.sel .k{background:var(--gold);color:#fff}
  .opt .ohi{color:#5a5d65;font-weight:600}
  .opt input{display:none}

  /* ---- result ---- */
  .score{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:20px 22px;margin-top:18px}
  .score .big{font-size:2.2rem;font-weight:900;line-height:1}
  .score .sub{font-size:.82rem;color:rgba(255,255,255,.7);margin-top:3px}
  .score .ring{text-align:center}
  .score .pct{font-size:1.5rem;font-weight:900;color:var(--gold2)}
  .rv .opt.ok{border-color:var(--ok);background:rgba(46,158,107,.12)} .rv .opt.ok .k{background:var(--ok);color:#fff}
  .rv .opt.bad{border-color:var(--bad);background:rgba(209,68,58,.1)} .rv .opt.bad .k{background:var(--bad);color:#fff}
  .rv .opt.cor{border-color:var(--ok);border-style:dashed} .rv .opt.cor .k{background:var(--ok);color:#fff}
  .badge{margin-left:auto;font-size:.64rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .badge.g{background:rgba(46,158,107,.16);color:#1f7a44}.badge.r{background:rgba(209,68,58,.14);color:#b91c1c}
  .expl{margin-top:9px;background:rgba(184,148,31,.07);border-left:3px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:.88rem;color:#4a4330}
  .center{text-align:center;padding:60px 20px;color:var(--muted)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .note{font-size:.8rem;color:var(--muted);margin-top:10px;text-align:center}
  /* ---- responsive: palette becomes a bottom-sheet + sticky action bar ---- */
  @media(max-width:920px){
    .wrap{padding-bottom:88px}
    .exam{display:block}
    .exam-side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;flex:none;border:none;border-radius:20px 20px 0 0;transform:translateY(112%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:60;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 -12px 34px -10px rgba(0,0,0,.45)}
    .exam-side.open{transform:translateY(0)}
    .side-close{display:inline-flex;align-items:center;justify-content:center}
    .side-grid{grid-template-columns:repeat(6,1fr);max-height:52vh}
    .side-foot{display:none}
    .sheet-ov{display:block}
    .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;align-items:center;gap:10px;background:linear-gradient(135deg,var(--navy),var(--navy2));padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -8px rgba(0,0,0,.45)}
  }
  @media(max-width:480px){ .hero h1{font-size:1.25rem} .score .big{font-size:1.8rem} .side-grid{grid-template-columns:repeat(5,1fr)} .tbar .tt{min-width:90px;font-size:.9rem} }

  /* ---- SCHEDULED screen: fully fluid (phone → tablet → laptop → desktop) ---- */
  .sch-wrap{max-width:560px;margin:0 auto}
  .sch-hero{padding:clamp(28px,6vw,42px) clamp(16px,5vw,26px) clamp(24px,5vw,34px)!important;text-align:center}
  .sch-emblem{width:clamp(70px,18vw,90px);height:clamp(70px,18vw,90px);border-radius:clamp(20px,5vw,27px);margin:0 auto clamp(14px,3.5vw,20px);display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,#243c66,#14213d);box-shadow:0 0 0 7px rgba(226,180,88,.1),0 20px 44px -16px rgba(20,33,61,.7);border:1.5px solid rgba(226,180,88,.5)}
  .sch-emblem span{font-size:clamp(2rem,6.5vw,2.6rem);line-height:1}
  .sch-title{font-weight:900;font-size:clamp(1.15rem,5.4vw,1.5rem);color:#14213d;letter-spacing:-.015em;line-height:1.2}
  .sch-pill{display:inline-block;margin:clamp(12px,3vw,16px) 0 2px;background:linear-gradient(135deg,rgba(232,197,107,.22),rgba(226,180,88,.1));border:1px solid rgba(226,180,88,.55);color:#8a6d1f;font-weight:800;font-size:clamp(.8rem,3.4vw,.96rem);padding:clamp(9px,2.4vw,12px) clamp(15px,4vw,24px);border-radius:30px;box-shadow:0 6px 16px -10px rgba(184,148,31,.5);max-width:100%}
  .sch-starts{margin:clamp(22px,5vw,30px) 0 clamp(11px,3vw,15px);font-size:clamp(.66rem,2.6vw,.72rem);letter-spacing:.18em;text-transform:uppercase;color:#9a8c66;font-weight:800}
  .sch-cd{display:flex;gap:clamp(7px,2.4vw,12px);justify-content:center;flex-wrap:nowrap;max-width:430px;margin:0 auto}
  .sch-seg{flex:1 1 0;min-width:0;max-width:100px;background:linear-gradient(158deg,#1d3156,#14213d);color:#fff;border-radius:clamp(13px,3.6vw,18px);padding:clamp(11px,3.2vw,17px) clamp(4px,1.6vw,11px);box-shadow:0 16px 34px -16px rgba(20,33,61,.8),inset 0 1px 0 rgba(255,255,255,.1);border:1px solid rgba(226,180,88,.26);text-align:center}
  .sch-seg b{display:block;font-size:clamp(1.45rem,6.6vw,2.1rem);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.25)}
  .sch-seg i{display:block;font-style:normal;font-size:clamp(.5rem,2.1vw,.58rem);letter-spacing:.14em;text-transform:uppercase;color:#e2b458;margin-top:clamp(5px,1.6vw,9px);font-weight:800}
  .sch-insh{padding:clamp(13px,3.6vw,17px) clamp(16px,5vw,22px);background:linear-gradient(135deg,#14213d,#243c66);display:flex;align-items:center;gap:10px}
  .sch-insh .t{color:#fff;font-weight:800;font-size:clamp(.95rem,4vw,1.04rem);letter-spacing:.01em}
  .sch-insh .r{margin-left:auto;font-size:clamp(.6rem,2.4vw,.66rem);letter-spacing:.1em;text-transform:uppercase;color:#e2b458;font-weight:800}
  .sch-insb{padding:clamp(4px,1vw,8px) clamp(16px,5vw,22px) clamp(14px,3.6vw,20px)}
  .sch-insb ul{list-style:none;padding:0;margin:0}
  .sch-insb li{display:flex;gap:clamp(10px,3vw,13px);align-items:flex-start;padding:clamp(10px,2.8vw,13px) 0}
  .sch-insb li+li{border-top:1px solid rgba(20,33,61,.07)}
  .sch-num{flex:0 0 auto;width:clamp(24px,6.2vw,28px);height:clamp(24px,6.2vw,28px);border-radius:50%;background:linear-gradient(145deg,#e8c56b,#b8941f);color:#14213d;font-weight:900;font-size:clamp(.76rem,3vw,.86rem);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px -3px rgba(184,148,31,.6),inset 0 1px 0 rgba(255,255,255,.4)}
  .sch-insb li .t{font-size:clamp(.87rem,3.7vw,.94rem);color:#2e2716;line-height:1.55;padding-top:2px}
</style>
</head>
<body>
  <div class="hero"><div class="hero-in">
    <div class="brand">
      <div class="logo" id="lg-wrap">
        <svg class="lg-svg" viewBox="0 0 100 100" role="img" aria-label="MVS Foundation">
          <defs><linearGradient id="lgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eccf78"/><stop offset="1" stop-color="#b8941f"/></linearGradient></defs>
          <circle cx="50" cy="50" r="48" fill="#14243f" stroke="url(#lgG)" stroke-width="3.5"/>
          <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#lgG)" stroke-width="1" opacity=".5"/>
          <path d="M50 26 L72 34 L50 42 L28 34 Z" fill="url(#lgG)"/>
          <path d="M37 38.5 V46.5 Q50 53.5 63 46.5 V38.5" fill="none" stroke="url(#lgG)" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M72 34 V45.5" stroke="url(#lgG)" stroke-width="1.5"/>
          <circle cx="72" cy="47" r="1.9" fill="url(#lgG)"/>
          <text x="50" y="75" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" fill="url(#lgG)" letter-spacing="1">MVS</text>
        </svg>
        <img id="lg-img" alt="MVS Foundation" style="display:none">
      </div>
      <div><div class="bt">MVS Foundation</div><div class="bs">Manish Verma Classes</div></div>
    </div>
    <h1 id="h-title">Loading test…</h1>
    <div class="meta" id="h-meta"></div>
  </div></div>
  <div class="wrap" id="app">
    <div class="center"><div class="spin"></div>Please wait…</div>
  </div>

<script>
(function(){
  "use strict";
  var token=(location.pathname.split("/t/")[1]||"").split(/[?#/]/)[0];
  var APP=document.getElementById("app");
  var H1=document.getElementById("h-title"), HM=document.getElementById("h-meta");
  var EX=null, ANS={}, MED="en", HASHI=false, STARTMS=0, TIMER=null, SUBMITTED=false;
  // Phase 2 — server-authoritative timer: timer server ke expires_at se chalta hai (reload pe reset nahi).
  var STARTED=false, SESS=null, DEADLINE=null, SAVE_T=null, HB=null;
  var _RANDOMIZED=false;   // Phase 4 — randomization sirf ek baar apply ho

  // ---------- randomization (Phase 4): per-student deterministic shuffle ----------
  function _hash32(s){ var h=2166136261>>>0; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function _mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function _seededShuffle(arr, seedStr){ var rnd=_mulberry32(_hash32(seedStr)); for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
  // seed = phone + exam id -> same student ko reload pe SAME order (stable), alag students ko alag.
  // answers q_no se store hote hain + grading text se, isliye order change grading ko affect nahi karta.
  function _applyRandomization(cfg){
    if(_RANDOMIZED || !cfg) return;
    var doQ=!!cfg.randomize_questions, doO=!!cfg.randomize_options;
    if(!doQ && !doO) return;
    var base=((window._reg&&window._reg.phone)||"")+":"+(EX.id||"");
    if(doO){
      (EX.questions||[]).forEach(function(q){
        var opts=q.options||[]; if(opts.length<2) return;
        var idx=opts.map(function(_,i){ return i; });
        _seededShuffle(idx, base+":o"+q.q_no);
        q.options=idx.map(function(i){ return opts[i]; });

      ents.forEach(function(e){ var qn=e.target.getAttribute("data-qn"); if(e.isIntersecting) vis[qn]=1; else delete vis[qn]; });
      var cur=null; Object.keys(vis).forEach(function(k){ var n=parseInt(k,10); if(cur==null||n<cur) cur=n; });

      if(cur!=null){ var pn=document.getElementById("pn-"+cur); if(pn) pn.classList.add("cur"); }

  // ---------- timer ----------
  function startTimer(){
    if(TIMER){ clearInterval(TIMER); TIMER=null; }

    function tick(){
      var el=document.getElementById("timer"); if(!el){ clearInterval(TIMER); TIMER=null; return; }
      var left=DEADLINE-Date.now(); var over=left<=0; if(over)left=0;
      var s=Math.floor(left/1000);
      var h=String(Math.floor(s/3600)).padStart(2,"0"), m=String(Math.floor((s%3600)/60)).padStart(2,"0"), ss=String(s%60).padStart(2,"0");
      var warn=(!over && left<=5*60000);   // 5 min se kam -> blink
      el.innerHTML='<span class="clk">⏱</span> '+h+":"+m+":"+ss; el.classList.toggle("over",over); el.classList.toggle("warn",warn);
      el.title=over?"Time over":(warn?"Less than 5 minutes left!":"Time remaining");
      if(over && !SUBMITTED){ clearInterval(TIMER); TIMER=null; doSubmit(true); }   // time khatam -> auto-submit
    }
    tick(); TIMER=setInterval(tick,1000);
  }

  // ---------- integrity / secure mode (Phase 3) ----------
  var _vSeq=0, _vCool=false, _vCount=0, _IGCFG=null, _watchFns=[];
  function startIntegrityWatch(cfg){
    _IGCFG=cfg||{}; _detachWatch();
    var add=function(tgt,ev,fn,opts){ tgt.addEventListener(ev,fn,opts||false); _watchFns.push([tgt,ev,fn,opts||false]); };
    // tab/app switch + minimize (ek transition = ek violation, cooldown se coalesce)
    add(document,"visibilitychange",function(){ if(document.hidden) _reportViolation("VISIBILITY_HIDDEN"); });
    add(window,"blur",function(){ _reportViolation("WINDOW_BLUR"); });
    add(window,"pagehide",function(){ _reportViolation("PAGE_EXIT"); });
    // fullscreen exit (STRICT)
    if(_IGCFG.require_fullscreen){
      var fsFn=function(){ if(!_inFS() && !SUBMITTED) _reportViolation("FULLSCREEN_EXIT"); };
      add(document,"fullscreenchange",fsFn); add(document,"webkitfullscreenchange",fsFn);
    }
    if(_IGCFG.block_copy) add(document,"copy",function(e){ e.preventDefault(); _reportViolation("COPY_ATTEMPT"); });
    if(_IGCFG.block_paste) add(document,"paste",function(e){ e.preventDefault(); _reportViolation("PASTE_ATTEMPT"); });
    if(_IGCFG.block_context) add(document,"contextmenu",function(e){ e.preventDefault(); _reportViolation("CONTEXT_MENU_ATTEMPT"); });
    if(_IGCFG.block_print) add(document,"keydown",function(e){
      var k=(e.key||"").toLowerCase();
      if((e.ctrlKey||e.metaKey)&&(k==="p"||k==="s"||k==="u")){ e.preventDefault(); _reportViolation("PRINT_SHORTCUT_ATTEMPT"); }
    });
  }
  function _detachWatch(){ _watchFns.forEach(function(w){ try{ w[0].removeEventListener(w[1],w[2],w[3]); }catch(e){} }); _watchFns=[]; }
  function _reportViolation(type){
    if(!_IGCFG||!_IGCFG.monitor||SUBMITTED) return;
    if(_vCool) return;                                   // ek hi transition ke multiple events -> ek violation
    _vCool=true; setTimeout(function(){ _vCool=false; },1000);
    _vSeq++;
    api("/exam/"+encodeURIComponent(token)+"/event","POST",{phone:window._reg.phone,type:type,seq:_vSeq})
      .then(function(r){ if(!r||!r.ok) return;
        _vCount=(r.violations!=null?r.violations:_vCount);
        _showViolationWarn(_vCount, r.max_violations, !!r.limit_reached);
        if(r.limit_reached && !SUBMITTED){ doSubmit(true); }   // STRICT limit -> auto-submit
      }).catch(function(){});                                   // network fail -> penalty nahi
  }
  function _showViolationWarn(count, max, reached){
    var strict=(_IGCFG&&_IGCFG.auto_submit);
    // top chip (persistent)
    var chip=document.getElementById("vchip");
    if(!chip){ chip=document.createElement("div"); chip.id="vchip";
      chip.style.cssText="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:60;background:#b91c1c;color:#fff;font-weight:800;font-size:.76rem;padding:5px 12px;border-radius:999px;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)";
      document.body.appendChild(chip); }
    chip.textContent="⚠ Warning "+count+(max?("/"+max):"");
    // flash banner
    var b=document.getElementById("vbanner");
    if(!b){ b=document.createElement("div"); b.id="vbanner";
      b.style.cssText="position:fixed;left:12px;right:12px;top:40px;z-index:61;background:#fff;border:2px solid #b91c1c;border-radius:12px;padding:12px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);text-align:center;font-size:.9rem;color:#991b1b;font-weight:700";
      document.body.appendChild(b); }
    b.innerHTML = reached
      ? "⚠ You have broken the test rules — the test is now being submitted."
      : ("⚠ Warning: please do not leave the test! ("+count+(max?("/"+max):"")+")"+(strict&&max?("<div style='font-size:.78rem;font-weight:600;margin-top:3px'>Leaving "+(max-count)+" more time(s) will submit the test automatically.</div>"):""));
    b.style.display="block";
    if(b._t) clearTimeout(b._t);
    b._t=setTimeout(function(){ if(b) b.style.display="none"; },4000);
  }

  // ---------- submit ----------
  function subBtns(){ return Array.prototype.slice.call(document.querySelectorAll(".js-sub")); }
  function doSubmit(auto){
    if(SUBMITTED) return;
    var answered=Object.keys(ANS).length, total=(EX.questions||[]).length;
    if(!auto && answered<total){
      sheet(false);
      var e=document.getElementById("t-err");
      if(e){ e.textContent="Please answer all "+total+" questions ("+answered+" done). Tap a number in the palette to jump to a skipped question."; e.style.display="block"; e.scrollIntoView({behavior:"smooth",block:"center"}); }
      return;
    }
    SUBMITTED=true; sheet(false);
    if(TIMER){ clearInterval(TIMER); TIMER=null; }
    if(HB){ clearInterval(HB); HB=null; } if(SAVE_T){ clearTimeout(SAVE_T); SAVE_T=null; }
    _detachWatch();   // integrity watch band — result ke baad warning na aaye
    try{ var _vc=document.getElementById("vchip"); if(_vc) _vc.remove(); var _vb=document.getElementById("vbanner"); if(_vb) _vb.remove(); }catch(e){}
    subBtns().forEach(function(b){ b.disabled=true; b.textContent="Submitting…"; });
    api("/exam/"+encodeURIComponent(token)+"/submit","POST",{details:window._reg,mcq_answers:ANS,auto:!!auto})
      .then(function(r){ try{ _saveDone(window._reg&&window._reg.phone, window._reg&&window._reg.name); }catch(e){} screenResult(r); })
      .catch(function(err){ SUBMITTED=false;
        subBtns().forEach(function(b){ b.disabled=false; b.textContent=(b.id==="mbar-sub"?"Submit":"Submit Test"); });
        if(HB){ clearInterval(HB); } if(SESS){ HB=setInterval(doSave,15000); }   // heartbeat wapas
        if(_IGCFG && _IGCFG.monitor && !auto){ startIntegrityWatch(_IGCFG); }     // monitoring wapas (manual retry)
        updAtt();
        var e=document.getElementById("t-err"); if(e){ e.textContent=err.message||"Could not submit. Try again."; e.style.display="block"; e.scrollIntoView({behavior:"smooth",block:"center"}); } });
  }

  // ---------- 3) RESULT ----------
  function _fmtMk(v){ v=Math.round(v*100)/100; return (v>0?"+":"")+v; }
  function screenResult(r){
    window.scrollTo(0,0); if(TIMER){ clearInterval(TIMER); TIMER=null; }
    var pct=r.total_marks?Math.round(r.total_awarded/r.total_marks*100):0;
    var comp=(r.exam_mode==="COMPETITIVE");
    var rev=(r.results||[]).map(function(it){
      var yourN=(it.your_answer==null?"":String(it.your_answer).trim().toLowerCase());
      var corN=String(it.correct_answer==null?"":it.correct_answer).trim().toLowerCase();
      var opts=(it.options||[]).map(function(o,oi){
        var oN=String(o).trim().toLowerCase(), cls="opt", badge="";
        var isSel=(yourN!==""&&oN===yourN), isCor=(corN!==""&&oN===corN);
        if(isSel&&isCor){ cls+=" ok"; badge='<span class="badge g">Your answer · Correct</span>'; }
        else if(isSel&&!isCor){ cls+=" bad"; badge='<span class="badge r">Your answer</span>'; }
        else if(isCor){ cls+=" cor"; badge='<span class="badge g">Correct answer</span>'; }
        return '<div class="'+cls+'"><span class="k">'+String.fromCharCode(65+oi)+'</span><span>'+optText(it,oi)+'</span>'+badge+'</div>';
      }).join("");
      // per-question marks badge (COMPETITIVE: +4 / -1 / 0)
      var mkB="";
      if(comp&&it.marks!=null){
        var mc=(it.status==="correct")?"#1f7a52":(it.status==="wrong")?"#c0392b":"#777";
        var mbg=(it.status==="correct")?"rgba(46,158,107,.14)":(it.status==="wrong")?"rgba(209,68,58,.12)":"rgba(0,0,0,.06)";
        mkB=' <span style="float:right;font-size:.8rem;font-weight:900;color:'+mc+';background:'+mbg+';border-radius:20px;padding:2px 10px">'+_fmtMk(it.marks)+'</span>';
      }
      var skip=(yourN==="")?'<div class="note" style="text-align:left;color:#b91c1c;font-weight:700">⚠ You did not answer this</div>':"";
      var expl=(it.explanation&&String(it.explanation).trim())?'<div class="expl"><b>Explanation:</b> '+esc(it.explanation)+'</div>':"";
      return '<div class="q rv" id="pq-'+it.q_no+'"><div class="q-h">Q'+it.q_no+'. '+qText(it)+mkB+'</div><div class="opts">'+opts+'</div>'+skip+expl+'</div>';
    }).join("");
    // ---- COMPETITIVE breakdown: correct / wrong / skipped with marks contribution ----
    var breakdown="";
    if(comp){
      var MC=(r.mark_correct||0), MW=(r.mark_wrong||0), MU=(r.mark_unanswered||0);
      var cell=function(n,lbl,contrib,col,bg){ return '<div style="flex:1;background:'+bg+';border-radius:12px;padding:11px 6px">'
        +'<div style="font-size:1.35rem;font-weight:900;color:'+col+';line-height:1">'+n+'</div>'
        +'<div style="font-size:.66rem;font-weight:800;color:'+col+';text-transform:uppercase;letter-spacing:.04em;margin-top:3px">'+lbl+'</div>'
        +'<div style="font-size:.74rem;font-weight:700;color:'+col+';opacity:.85;margin-top:2px">'+contrib+'</div></div>'; };
      breakdown='<div class="card" style="margin-top:14px;padding:14px 12px">'
        +'<div style="display:flex;gap:8px;text-align:center">'
        +cell(r.correct,"Correct",_fmtMk(r.correct*MC),"#1f7a52","rgba(46,158,107,.1)")
        +cell(r.wrong,"Wrong",_fmtMk(r.wrong*MW),"#c0392b","rgba(209,68,58,.09)")
        +cell(r.unanswered,"Skipped",(MU?_fmtMk(r.unanswered*MU):"0"),"#555","rgba(0,0,0,.045)")
        +'</div>'
        +'<div style="text-align:center;margin-top:11px;font-size:.84rem;color:#14213d"><b>Net Score:</b> <span style="color:#b8941f;font-weight:900">'+r.total_awarded+'</span> / '+r.total_marks
        +' <span style="color:#9a8c66">· marking +'+(+MC)+' / '+(+MW)+' / '+(+MU)+'</span></div>'
        +'</div>';
    }
    // ---- premium Top 10 leaderboard (ranked; tie -> earlier submit higher) ----
    APP.innerHTML=
      '<div class="narrow"><div class="score"><div><div class="big">'+r.total_awarded+' / '+r.total_marks+'</div><div class="sub">'+r.correct+' of '+r.q_total+' correct</div></div><div class="ring"><div class="pct">'+pct+'%</div></div></div>'
      +breakdown
      +'<div class="card" style="margin-top:14px"><b>Thank you, '+esc((window._reg&&window._reg.name)||'Student')+'!</b><div class="lead" style="margin:4px 0 0">Your test has been submitted to MVS Foundation. Review your answers below.</div></div>'
      +'<div id="lb-box">'+_lbHtml(r)+'</div>'
      +rev
      +'<div class="note" style="margin-top:20px">MVS Foundation · Manish Verma Classes</div></div>';
    H1.textContent="Your Result"; HM.innerHTML="";
    _startLbPoll();   // live ranking (non-scheduled) + scheduled test ka auto-reveal
  }
  // leaderboard / ranking card — visible ya "ranking abhi band" dono handle karta hai
  function _lbHtml(r){
    if(r.ranking_pending){
      var _manual=(r.ranking_mode==='manual');
      var when=r.ranking_at?_fmtSched(r.ranking_at):"";
      var _title=_manual?'Ranking will be published by your teacher':'Ranking opens after the test closes';
      var _sub=_manual?'You’ll see the leaderboard here once your teacher declares it.'
                      :(when?('The live leaderboard will appear automatically after '+esc(when)+'.'):'');
      return '<div class="card" style="margin-top:14px;padding:18px 16px;text-align:center;background:rgba(37,99,235,.05);border:1px solid rgba(37,99,235,.18)">'
        +'<div style="font-size:1.7rem">🏆</div>'
        +'<b style="color:#14213d">'+_title+'</b>'
        +(_sub?'<div class="lead" style="margin:5px 0 0;font-size:.86rem">'+_sub+'</div>':'')
        +((r.total_students)?'<div style="margin-top:9px;font-size:.82rem;color:#5b6472">'+r.total_students+' student(s) submitted so far</div>':'')
        +'</div>';
    }
    var lb=(r.leaderboard||[]), myRank=r.my_rank;
    if(!lb.length) return '';
    var rows=lb.map(function(it){
      var isMe=(myRank&&it.rank===myRank);
      var medal=it.rank===1?"🥇":it.rank===2?"🥈":it.rank===3?"🥉":"";
      var rankBg=it.rank<=3?"linear-gradient(145deg,#e2b458,#b8941f)":"#14213d";
      return '<div style="display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;margin-bottom:7px;'
        +(isMe?"background:rgba(226,180,88,.18);border:1.5px solid #e2b458":"background:#fff;border:1px solid #ece4d0")+'">'
        +'<div style="width:36px;height:36px;flex:0 0 auto;border-radius:11px;background:'+rankBg+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:'+(medal?"1.1rem":".92rem")+'">'+(medal||it.rank)+'</div>'
        +'<div style="flex:1;min-width:0;font-weight:800;color:#14213d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(it.name)+(isMe?' <span style="background:#14213d;color:#e2b458;font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:20px;vertical-align:middle;letter-spacing:.05em">YOU</span>':"")+'</div>'
        +'<div style="font-weight:900;color:#14213d;font-variant-numeric:tabular-nums">'+it.score+'<span style="color:#9a8c66;font-weight:700;font-size:.82em">/'+it.total+'</span></div>'
        +'</div>';
    }).join("");
    var myChip=(myRank?'<div style="text-align:center;margin:0 0 14px"><span style="background:rgba(20,33,61,.07);color:#14213d;font-weight:700;font-size:.86rem;padding:7px 17px;border-radius:30px">Your rank: <b style="color:#b8941f">#'+myRank+'</b> of '+(r.total_students||lb.length)+'</span></div>':"");
    return '<div class="card" style="margin-top:14px;padding:18px 16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:13px"><span style="font-size:1.2rem">🏆</span><b style="color:#14213d;font-size:1.02rem">Top 10 Leaderboard</b><span style="margin-left:auto;font-size:.6rem;font-weight:800;color:#1f7a52;background:rgba(46,158,107,.12);padding:2px 8px;border-radius:999px;letter-spacing:.05em">● LIVE</span></div>'+myChip+rows+'</div>';
  }
  // har ~20s current ranking laakar leaderboard update karo (live + scheduled auto-reveal)
  function _startLbPoll(){
    if(window._lbT){ clearInterval(window._lbT); }
    var n=0;
    window._lbT=setInterval(function(){
      n++; if(n>45){ clearInterval(window._lbT); window._lbT=null; return; }   // ~15 min baad ruk jao
      api("/exam/"+encodeURIComponent(token)+"/leaderboard?phone="+encodeURIComponent((window._reg&&window._reg.phone)||""),"GET")
        .then(function(d){ var box=document.getElementById("lb-box"); if(box&&d){ box.innerHTML=_lbHtml(d); } })
        .catch(function(){});
    }, 20000);
  }

  // ---------- SCHEDULED: premium countdown + details (test opens automatically) ----------
  function _pad2(n){ return (n<10?"0":"")+n; }
  function _fmtSched(iso){ try{ return new Date(iso).toLocaleString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
  function screenScheduled(ex){
    if(HM) HM.innerHTML="";   // test start se pehle koi detail nahi — sirf countdown + instructions
    var secs=Math.max(0,parseInt(ex.seconds_to_start||0,10));
    var ig=ex.integrity||{}, igMon=!!ig.monitor, igStrict=(ig.mode==="STRICT");
    function seg(v,l){ return '<div class="sch-seg"><b>'+v+'</b><i>'+l+'</i></div>'; }
    // ---- instructions ONLY (generic rules; test ke specifics start hone par dikhenge) ----
    var ins=[];
    ins.push("The test will open <b>automatically</b> at the scheduled time — just keep this page open.");
    ins.push("Once it opens, a <b>live timer</b> runs and the test <b>submits automatically</b> when the time ends.");
    ins.push("Your answers are <b>saved automatically</b>. Even if the page reloads, your progress and remaining time stay the same.");
    ins.push("All <b>test details and the marking scheme</b> will be shown on screen the moment the test begins.");
    if(igStrict) ins.push("This is a <b>secure test</b> — it runs in fullscreen, and copy, paste and right-click are disabled.");
    else if(igMon) ins.push("Please <b>stay on this tab</b> during the test — switching tabs or apps will be recorded.");
    ins.push("Enter your <b>correct name and phone number</b> — your result and rank are linked to them.");
    ins.push("Use a device with a <b>stable internet connection</b> and enough battery.");
    var insHtml=ins.map(function(t,i){ return '<li><span class="sch-num">'+(i+1)+'</span><span class="t">'+t+'</span></li>'; }).join("");
    APP.innerHTML=
      '<div class="sch-wrap">'
      // ---- HERO (gold-accented, glowing emblem, countdown) ----
      +'<div class="card" style="padding:0;overflow:hidden;position:relative">'
      +'<div style="height:5px;background:linear-gradient(90deg,#b8941f,#e8c56b 45%,#f2dd9e 55%,#b8941f)"></div>'
      +'<div class="sch-hero">'
      +'<div class="sch-emblem"><span>⌛</span></div>'
      +'<div class="sch-title">This test is scheduled</div>'
      +'<div class="sch-pill">🗓 '+esc(_fmtSched(ex.scheduled_at))+'</div>'
      +'<div class="sch-starts">Starts in</div>'
      +'<div id="cd-box" class="sch-cd"></div>'
      +'</div></div>'
      // ---- INSTRUCTIONS ----
      +'<div class="card" style="padding:0;overflow:hidden;margin-top:14px">'
      +'<div class="sch-insh"><span style="font-size:1.1rem">📋</span><span class="t">Instructions</span><span class="r">Please read</span></div>'
      +'<div class="sch-insb"><ul>'+insHtml+'</ul></div>'
      +'</div>'
      +'<div class="note" style="margin-top:16px">MVS Foundation · Manish Verma Classes</div>'
      +'</div>';
    H1.textContent=ex.title||"Test";
    var box=document.getElementById("cd-box");
    function paint(){ var s=secs,d=Math.floor(s/86400); s-=d*86400; var h=Math.floor(s/3600); s-=h*3600; var m=Math.floor(s/60), ss=s-m*60;
      var html=""; if(d>0) html+=seg(d,"Days"); html+=seg(_pad2(h),"Hours")+seg(_pad2(m),"Min")+seg(_pad2(ss),"Sec"); box.innerHTML=html; }
    function openNow(){ if(TIMER){clearInterval(TIMER);TIMER=null;} box.innerHTML='<div style="font-weight:800;color:#047857;font-size:1.15rem">Starting the test…</div>'; setTimeout(function(){ location.reload(); },1200); }
    if(secs<=0){ openNow(); return; }
    paint();
    if(TIMER){ clearInterval(TIMER); }
    TIMER=setInterval(function(){ secs--; if(secs<=0){ openNow(); return; } paint(); },1000);
  }

  // ---------- window CLOSED screen (scheduled test ka time khatam) ----------
  function screenClosed(ex){
    if(HM) HM.innerHTML="";
    var whenTxt=ex.closed_at?_fmtSched(ex.closed_at):"";
    APP.innerHTML=
      '<div class="sch-wrap">'
      +'<div class="card" style="padding:0;overflow:hidden;position:relative">'
      +'<div style="height:5px;background:linear-gradient(90deg,#8a6d1f,#c8912f 50%,#8a6d1f)"></div>'
      +'<div class="sch-hero">'
      +'<div class="sch-emblem" style="background:linear-gradient(155deg,#3a1620,#24101a);box-shadow:0 0 0 7px rgba(176,88,70,.12),0 20px 44px -16px rgba(58,22,32,.6);border:1.5px solid rgba(226,180,88,.4)"><span>🔒</span></div>'
      +'<div class="sch-title">This test is closed</div>'
      +'<div class="lead" style="margin:12px auto 0;max-width:430px;font-size:clamp(.88rem,3.6vw,.96rem)">The time window for this test has ended. New responses are no longer being accepted.</div>'
      +(whenTxt?'<div class="sch-pill" style="margin-top:16px">🗓 Closed · '+esc(whenTxt)+'</div>':'')
      +'</div></div>'
      +'<div class="note" style="margin-top:16px">MVS Foundation · Manish Verma Classes</div>'
      +'</div>';
    H1.textContent=ex.title||"Test";
  }

  // ---------- boot ----------
  function _savedPhone(){ try{ return localStorage.getItem('mvs_ph_'+token)||''; }catch(e){ return ''; } }
  function _savedName(){ try{ return localStorage.getItem('mvs_nm_'+token)||''; }catch(e){ return ''; } }
  function _saveDone(ph,nm){ try{ if(ph){ localStorage.setItem('mvs_ph_'+token, String(ph)); if(nm) localStorage.setItem('mvs_nm_'+token, String(nm)); } }catch(e){} }
  function _routeOpen(ex){
    if(ex.not_started){ screenScheduled(ex); return; }
    if(ex.closed){ screenClosed(ex); return; }      // window khatam -> closed (naye students)
    screenRegister();
  }
  function fail(msg){ H1.textContent="Test unavailable"; HM.innerHTML=""; APP.innerHTML='<div class="card center" style="padding:40px 20px"><div style="font-size:2rem">🔒</div><p style="font-weight:700;margin:10px 0 4px">'+esc(msg)+'</p><div class="lead">Please check the link with MVS Foundation.</div></div>'; }
  if(!token){ fail("Invalid test link."); return; }
  api("/exam/"+encodeURIComponent(token)).then(function(ex){
    EX=ex; HASHI=hasHindi(); H1.textContent=ex.title||"Test";
    // isi browser se pehle submit kiya tha? -> seedha result, dubara form nahi
    var savedPh=_savedPhone();
    if(savedPh){
      return api("/exam/"+encodeURIComponent(token)+"/myresult?phone="+encodeURIComponent(savedPh),"GET")
        .then(function(mr){ if(mr&&mr.found&&mr.result){ if(!window._reg) window._reg={name:_savedName()||"Student",phone:savedPh}; screenResult(mr.result); } else { _routeOpen(ex); } })
        .catch(function(){ _routeOpen(ex); });
    }
    _routeOpen(ex);
  }).catch(function(err){ fail(err.message||"This test link is not available."); });
})();
</script>
</body>
</html>
